services:

  postgres:
    image: postgres:16
    container_name: ai-copilot-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot_password
      POSTGRES_DB: copilot_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: